name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build con la imagen oficial de Buildozer (Kivy)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            kivy/buildozer android debug

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sistema-diario-apk
          path: bin/*.apk
